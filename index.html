<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Island Habitat Rescue</title>
<meta name="description" content="66 Maldives lagoon, beach and jungle science missions for Grades 1-6.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/polish.css">
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <button class="brand" data-action="App.go" data-args="%5B%22home%22%5D" aria-label="Home">
            <span class="brand-mark" aria-hidden="true">🐢</span>
            <span class="brand-text">
                <b>Island Habitat Rescue</b>
                <small>Maldives Field Station</small>
            </span>
        </button>
        <nav class="topbar-tools" aria-label="Game tools">
            <button class="stat" data-action="App.go" data-args="%5B%22hub%22%5D" title="Stars earned">
                <span id="stat-star-icon"></span><span id="stat-stars">0</span>
            </button>
            <button class="stat" data-action="App.go" data-args="%5B%22journal%22%5D" title="Field Journal">
                <span aria-hidden="true">📖</span><span id="stat-journal">0</span>
            </button>
            <button class="icon-btn" id="btn-sound" data-action="App.toggleSound" data-args="%5B%5D" aria-label="Sound on or off"></button>
            <button class="icon-btn" id="btn-settings" data-action="App.openSettings" data-args="%5B%5D" aria-label="Settings and progress"></button>
        </nav>
    </div>
</header>

<p id="storage-notice" class="storage-notice" role="status" hidden></p>
<main id="app" class="app"></main>

<div id="sippy" class="sippy" hidden></div>

<div id="modal" class="modal" hidden data-modal-backdrop>
    <div class="modal-card panel" id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
