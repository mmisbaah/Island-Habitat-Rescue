<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Island Habitat Rescue</title>
<meta name="description" content="66 Maldives lagoon, beach and jungle science missions for Grades 1-6.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <button class="brand" onclick="App.go('home')" aria-label="Home">
            <span class="brand-mark" aria-hidden="true">🐢</span>
            <span class="brand-text">
                <b>Island Habitat Rescue</b>
                <small>Maldives Field Station</small>
            </span>
        </button>
        <nav class="topbar-tools" aria-label="Game tools">
            <button class="stat" onclick="App.go('hub')" title="Stars earned">
                <span id="stat-star-icon"></span><span id="stat-stars">0</span>
            </button>
            <button class="stat" onclick="App.go('journal')" title="Field Journal">
                <span aria-hidden="true">📖</span><span id="stat-journal">0</span>
            </button>
            <button class="icon-btn" id="btn-sound" onclick="App.toggleSound()" aria-label="Sound on or off"></button>
            <button class="icon-btn" id="btn-settings" onclick="App.openSettings()" aria-label="Settings and progress"></button>
        </nav>
    </div>
</header>

<main id="app" class="app"></main>

<div id="sippy" class="sippy" hidden></div>

<div id="modal" class="modal" hidden onclick="if (event.target === this) App.closeModal()">
    <div class="modal-card panel" id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
</div>

<!-- Core -->
<script src="js/core/icons.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/core/sippy.js"></script>
<!-- Data -->
<script src="js/data/species.js"></script>
<script src="js/data/missions.js"></script>
<script src="js/data/missions-g1.js"></script>
<script src="js/data/missions-g2.js"></script>
<script src="js/data/missions-g3.js"></script>
<script src="js/data/missions-g4.js"></script>
<script src="js/data/missions-g5.js"></script>
<script src="js/data/missions-g6.js"></script>
<script src="js/data/catalog.js"></script>
<!-- Visual labs -->
<script src="js/labs/match.js"></script>
<script src="js/labs/dials.js"></script>
<script src="js/labs/choice.js"></script>
<script src="js/labs/sequence.js"></script>
<script src="js/labs/links.js"></script>
<script src="js/labs/cascade.js"></script>
<!-- Screens -->
<script src="js/screens/island-map.js"></script>
<script src="js/screens/home.js"></script>
<script src="js/screens/hub.js"></script>
<script src="js/screens/mission.js"></script>
<script src="js/screens/journal.js"></script>
<script src="js/screens/reef-rush.js"></script>
<script src="js/screens/quiz.js"></script>
<script src="js/app.js"></script>
</body>
</html>
